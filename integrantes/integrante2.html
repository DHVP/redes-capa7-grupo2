  <noscript><style>.universe,.hud,.scene-hint,.scene-counter{display:none}body.home{overflow:auto;height:auto}.fallback{max-width:700px;padding:40px;margin:auto;font:18px/1.7 system-ui}.fallback a{text-decoration:underline}</style><main class="fallback"><h1>Grupo 02 · Redes y Comunicaciones</h1><p>El recorrido animado necesita JavaScript. Estos son los integrantes del grupo:</p><ul><li><a href="../integrantes/integrante1.html">Camilo Rubiano</a></li><li><a href="../integrantes/integrante2.html">Diego Humberto Vargas Palacios</a></li><li><a href="../integrantes/integrante3.html">Julián Rubiano Santofimio</a></li></ul><h2>Camilo Rubiano</h2><p>Soy Camilo Rubiano, integrante del grupo 2 de Redes de Computadoras y aficionado a las redes y la ciberseguridad. Me interesa entender cómo se comunican los dispositivos y cómo proteger la información que viaja entre ellos. Mi objetivo es fortalecer mis conocimientos para configurar redes, identificar problemas de conectividad y comprender sus riesgos de seguridad. En el curso exploro OSI, IPv4, VLAN y HTTP.</p><h2>Diego Humberto Vargas Palacios</h2><p>Ingeniero de Sistemas de la Universidad de Ibagué. Le interesan las redes, la infraestructura y los servicios web. Ha estudiado OSI, TCP/IP, IPv4, IPv6, enrutamiento y protocolos de aplicación.</p><h2>Julián Rubiano Santofimio</h2><p>Estudiante de Ingeniería de la Universidad de Ibagué, comprometido con aprender y desafiarse a sí mismo. Su recorrido abarca OSI, subnetting, UTP, VLAN, Cisco, GNS3 y máquinas virtuales.</p></main></noscript>
